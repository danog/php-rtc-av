name: AV TESTS

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
#        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.4 with FFI
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: ffi
          ini-values: ffi.enable=true
          tools: composer:v2

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Install FFmpeg 7.1.1 on Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt update
          sudo apt install -y \
            autoconf automake build-essential cmake git libtool \
            pkg-config texinfo zlib1g-dev libx264-dev libx265-dev \
            libvpx-dev libfdk-aac-dev libmp3lame-dev libopus-dev \
            nasm

          git clone https://github.com/FFmpeg/FFmpeg.git
          cd FFmpeg
          git checkout n7.1.1
          ./configure --enable-shared --enable-gpl --enable-nonfree \
            --enable-libx264 --enable-libx265 --enable-libvpx \
            --enable-libfdk-aac --enable-libmp3lame --enable-libopus
          make -j$(nproc)
          sudo make install
          sudo ldconfig
          ffmpeg -version

