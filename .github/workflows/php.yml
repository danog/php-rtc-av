name: PHP-AV CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.4 with FFI
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: ffi
          ini-values: ffi.enable=true
          tools: composer:v2

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install NASM
        run: sudo apt-get install -y nasm

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Install FFmpeg 
        run: |
          sudo apt update
          sudo apt install -y \
            autoconf automake build-essential cmake git libtool \
            pkg-config texinfo zlib1g-dev libx264-dev libx265-dev \
            libvpx-dev libfdk-aac-dev libmp3lame-dev libopus-dev \
            libx264-dev ffmpeg

          ffmpeg -version

      - name: Check PHP and FFI status
        run: |
          php -v
          php -r "echo 'FFI enabled: ' . (extension_loaded('ffi') ? 'yes' : 'no') . PHP_EOL;"


      - name: Run PHPUnit tests
        run: vendor/bin/phpunit
